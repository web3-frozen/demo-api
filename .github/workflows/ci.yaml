name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_reason:
        description: "Why this image is being rebuilt"
        required: false
        type: string
      cve_ids:
        description: "Comma-separated baseline CVE IDs"
        required: false
        type: string
      previous_image:
        description: "Previously deployed image digest/reference"
        required: false
        type: string
      baseline_run_id:
        description: "CVE remediation run containing the baseline artifact"
        required: false
        type: string
      application:
        description: "Argo CD Application to verify after merge"
        required: false
        type: string

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:
  demo-api:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: demo-api
      image-name: demo-api
      workload-dir: workloads/demo-app
      go-version: "1.27.4"
      application: demo-app
      rebuild_reason: ${{ github.event.inputs.rebuild_reason || '' }}
      cve_ids: ${{ github.event.inputs.cve_ids || '' }}
      previous_image: ${{ github.event.inputs.previous_image || '' }}
      baseline_run_id: ${{ github.event.inputs.baseline_run_id || '' }}
    secrets: inherit

  demo-inventory:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: demo-inventory
      image-name: demo-inventory
      workload-dir: workloads/demo-app
      dockerfile: Dockerfile.inventory
      go-version: "1.27.4"
      application: demo-app
      rebuild_reason: ${{ github.event.inputs.rebuild_reason || '' }}
      cve_ids: ${{ github.event.inputs.cve_ids || '' }}
      previous_image: ${{ github.event.inputs.previous_image || '' }}
      baseline_run_id: ${{ github.event.inputs.baseline_run_id || '' }}
    secrets: inherit

  demo-pricing:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: demo-pricing
      image-name: demo-pricing
      workload-dir: workloads/demo-app
      dockerfile: Dockerfile.pricing
      go-version: "1.27.4"
      application: demo-app
      rebuild_reason: ${{ github.event.inputs.rebuild_reason || '' }}
      cve_ids: ${{ github.event.inputs.cve_ids || '' }}
      previous_image: ${{ github.event.inputs.previous_image || '' }}
      baseline_run_id: ${{ github.event.inputs.baseline_run_id || '' }}
    secrets: inherit
