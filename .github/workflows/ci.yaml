name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read
  id-token: write

jobs:
  demo-api:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: demo-api
      image-name: demo-api
      workload-dir: workloads/demo-app
      go-version: "1.27.4"
    secrets: inherit

  demo-inventory:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: demo-inventory
      image-name: demo-inventory
      workload-dir: workloads/demo-app
      dockerfile: Dockerfile.inventory
      go-version: "1.27.4"
    secrets: inherit

  demo-pricing:
    uses: web3-frozen/homelab-apps/.github/workflows/ci-container.yaml@main
    with:
      app-name: demo-pricing
      image-name: demo-pricing
      workload-dir: workloads/demo-app
      dockerfile: Dockerfile.pricing
      go-version: "1.27.4"
    secrets: inherit
